<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <link rel="stylesheet" href="memory.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Memory Game</title>
  </head>
  <body>
    <div class="memory-contianer">
      <div class="mem-header">
        <h1> <i class="fas fa-star"></i> Memory Card Match <i class="fas fa-star"></i> </h1>
        <div class="game-stats">
          <div class="game-stat">
            <div class="stat-label">Moves</div>
            <div class="stat-value" id="moves">0</div>
          </div>

          <div class="game-stat">
            <div class="stat-label">Time</div>
            <div class="stat-value" id="time">0:00</div>
          </div>

          <div class="game-stat">
            <div class="stat-label">Matches</div>
            <div class="stat-value" id="matches">0/8</div>
          </div>
        </div>
      </div>
    </div>

    <div class="memory-board" id="memoryBoard">
    </div>

    <div class="game-controls">
      <button class="btn" onclick="newGame()"
      ><i class="fas fa-redo"></i> New Game</button>
    </div>

    <div class="logic" id="winLogic">
      <div class="logic-content">
        <h2><i class="fas fa-trophy"></i> You Win! <i class="fas fa-trophy"></i></h2>
        <p>Moves: <span id="finalMoves"></span>
        <br>
        Time: <span id="finalTime"></span>
        </p>
        <button class="btn" onclick="newGame()">Play Again</button>
      </div>
    </div>

    <script src="memory.js"></script>
  </body>
</html>
